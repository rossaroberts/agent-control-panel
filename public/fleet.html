<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
/* After iA Writer: paper, ink, one typeface, one blue. Structure is whitespace and tone, never boxes; words only where a
   glyph can't say it. Every text colour clears 4.5:1 on paper and on the selection tint; --quiet is for drawn marks only. */
:root {
  --cols: 10px minmax(220px, 380px) 84px 70px 70px 60px 64px 56px minmax(0, 1fr);
  --cols-mid: 10px minmax(0, 1fr) 84px 70px 70px 64px 56px;
  --cols-narrow: 10px minmax(0, 1fr) 84px 64px;
  --paper: #f6f7f7; --tint: #eceeef; --ink: #1e2124; --grey: #5f666b; --quiet: #858c91; --rule: #e2e5e7;
  --blue: #0a72a3; --orange: #a5560f; --red: #bf3f33; --green: #2b7d52;
  --font: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --pane: var(--pane-w, 460px); --rail: 44px; --term-bg: #16181a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #191b1d; --tint: #232729; --ink: #dcdfe1; --grey: #9ba2a7; --quiet: #6c7277; --rule: #2c3033;
          --blue: #3fb6ee; --orange: #ef9a4c; --red: #ec7468; --green: #5fbd8b; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.7 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in srgb, var(--blue) 24%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
main { width: min(1500px, 100% - 64px); margin: 0 auto; padding: 44px 0 120px; container-type: inline-size; }
body.has-pane main { width: calc(100% - var(--pane) - 64px); margin-left: 32px; }
body.has-pane.pane-min main { width: calc(100% - var(--rail) - 64px); }
button, input, select, textarea { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; }
button, select { cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }
svg.i { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
.p-more svg.i { stroke-width: 2.4; }

/* top line */
.top { display: flex; align-items: center; gap: 22px; margin-bottom: 36px; }
.top h1 { font-size: 15px; font-weight: 500; margin: 0; flex: 1; letter-spacing: .01em; }
.top a, .top button { color: var(--grey); display: inline-flex; align-items: center; }
.top a:hover, .top button:hover { color: var(--ink); }
.top button.busy svg { animation: turn 900ms linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .top button.busy svg { animation: none; opacity: .5; } }
.err { color: var(--red); font-size: 13px; margin: -16px 0 22px; white-space: pre-line; }

/* accounts: one line each; the one new agents go to sits on the tint */
.acct { display: grid; grid-template-columns: 8ch 1fr auto; gap: 0 18px; align-items: baseline; padding: 1px 10px; margin: 0 -10px; border-radius: 4px; cursor: pointer; }
.acct .name { color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct:hover .name, .acct.on .name { color: var(--ink); }
.acct.on { background: var(--tint); }
.room { display: flex; gap: 24px; align-items: baseline; font-size: 13px; color: var(--grey); white-space: nowrap; min-width: 0; }
.room i { font-style: normal; margin-right: 8px; }
.line { position: relative; display: inline-block; width: 64px; height: 2px; background: var(--rule); top: -3px; margin-right: 8px; }
.line b { position: absolute; inset: 0 auto 0 0; background: var(--grey); }
.line b.mid { background: var(--orange); } .line b.hi { background: var(--red); }
.cap { color: var(--red); }
.tally { display: flex; gap: 12px; font-size: 13px; color: var(--grey); white-space: nowrap; }
.tally span { display: inline-flex; align-items: baseline; gap: 5px; }

/* machines: one line each */
.machines { margin-top: 22px; }
.mline { display: grid; grid-template-columns: 8ch 1fr auto; gap: 0 18px; align-items: baseline; }
.mline .nm { color: var(--grey); }
.vitals { display: flex; flex-wrap: wrap; gap: 0 18px; font-size: 13px; color: var(--ink); min-width: 0; }
.vitals span { white-space: nowrap; }
.vitals i { font-style: normal; color: var(--grey); margin-right: 6px; }
.vitals .hi { color: var(--red); } .vitals .mid { color: var(--orange); }

/* the prompt: the one large thing */
.write { margin: 44px 0 32px; }
.write textarea { display: block; width: 100%; font-size: 22px; line-height: 1.5; resize: none; overflow: hidden; caret-color: var(--blue); }
.write textarea::placeholder { color: var(--grey); }
.how { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 22px; margin-top: 12px; font-size: 13px; }
.how select, .how input { color: var(--grey); border-bottom: 1px dotted var(--quiet); padding-bottom: 1px; }
.how select { appearance: none; -webkit-appearance: none; }
.how select:hover, .how input:hover, .how input:focus { color: var(--ink); border-bottom-color: var(--ink); outline: none; }
.how .sp { flex: 1; }
.fire { color: var(--blue); font-weight: 500; }
.fire:disabled { color: var(--grey); cursor: default; }
.fired { font-size: 13px; margin-top: 8px; min-height: 1.7em; color: var(--grey); }
.fired.ok { color: var(--green); } .fired.no { color: var(--red); }
.faint { color: var(--grey); }

/* sessions: one grid for the column names and every row, dropping columns as the list narrows */
.s, .c { display: grid; grid-template-columns: var(--cols); gap: 0 18px; align-items: baseline; }
.s { padding: 2px 10px; margin: 0 -10px; border-radius: 4px; cursor: pointer; }
.s:hover { background: color-mix(in srgb, var(--tint) 60%, transparent); }
.s.open { background: var(--tint); }
.s .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .stage, .s .at, .s .who, .s .eff, .s .ctx, .s .use, .s .what { font-size: 13px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s .ctx, .s .use { text-align: right; }
.s .ctx .line { width: 44px; margin-right: 0; }
.s .ctx.mid, .s .use.mid { color: var(--orange); }
.s .ctx.hi, .s .use.hi { color: var(--red); }
.s .why { grid-column: 2 / -1; font-size: 13px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; position: relative; top: -1px; }
.dot.working { background: var(--blue); }
.dot.needs-you { background: var(--orange); }
.dot.capped { background: var(--red); }
.dot.capped.lifted { background: var(--orange); }
.dot.ready { box-shadow: inset 0 0 0 1.5px var(--quiet); }
.dot.closed { background: var(--quiet); opacity: .7; }

/* epics */
.epic { margin-top: 34px; }
main > #machines > .epic:first-child { margin-top: 0; }
.epic header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; margin-bottom: 4px; }
.epic h2 { font: inherit; font-weight: 500; margin: 0; }
.epic header .test { font-size: 13px; display: inline-flex; align-items: baseline; gap: 4px; }
.epic header .tally { margin-left: auto; }

/* what needs you: above every group, oldest wait first */
.epic.urgent h2 { color: var(--orange); }

/* closed sessions: under their epic's open ones, smaller and closer */
.shut { margin-top: 10px; }
.shut .bar { display: flex; align-items: baseline; gap: 16px; font-size: 13px; color: var(--grey); padding: 6px 0 2px; border-top: 1px solid var(--rule); }
.shut .bar button { color: var(--grey); } .shut .bar .fold-closed { font-size: 13px; } .shut .bar button:hover { color: var(--ink); } .shut .bar button.armed { color: var(--red); }
.c { padding: 0 10px; margin: 0 -10px; border-radius: 4px; font-size: 13px; line-height: 1.6; color: var(--grey); cursor: pointer; }
.c:hover { background: color-mix(in srgb, var(--tint) 60%, transparent); color: var(--ink); }
.c.open { background: var(--tint); color: var(--ink); }
.c span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c .ctx { text-align: right; }
.reading { color: var(--grey); font-size: 13px; margin-top: 34px; }

@container (max-width: 1080px) {
  .s, .c { grid-template-columns: var(--cols-mid); }
  .eff, .what { display: none; }
}
@container (max-width: 760px) {
  .s, .c { grid-template-columns: var(--cols-narrow); }
  .at, .who, .use { display: none; }
  .s .ttl { white-space: normal; }
  .mline { grid-template-columns: 8ch 1fr; } .mline .tally, .acct .tally { display: none; }
  .acct { grid-template-columns: 8ch 1fr; }
}

/* the session open on the right: full height, its conversation scrolling, the message box at the bottom */
#pane { position: fixed; top: 0; right: 0; bottom: 0; width: var(--pane); display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid var(--rule); z-index: 5; }
#pane[hidden] { display: none; }
#p-grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 1; touch-action: none; }
#p-grip:hover, #p-grip.drag { background: linear-gradient(90deg, transparent 3px, var(--blue) 3px, var(--blue) 5px, transparent 5px); }
#p-rail { display: none; }
body.pane-min #pane { width: var(--rail); }
body.pane-min #pane > :not(#p-rail) { display: none; }
body.pane-min #p-rail { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; height: 100%; padding: 22px 0; color: var(--grey); }
#p-rail:hover { color: var(--ink); }
#p-rail .v { writing-mode: vertical-rl; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 70vh; }
#p-term { flex: 1; min-height: 0; background: var(--term-bg); padding: 6px 2px 2px 12px; }
#p-term[hidden] { display: none; }
#p-term { position: relative; }
#p-term .tview { height: 100%; position: relative; }
#p-term .tview[hidden] { display: none; }
#p-term .xterm { height: 100%; }
#p-term .ghost { position: absolute; z-index: 10; pointer-events: none; white-space: pre; color: #8f979c; background: var(--term-bg);
                 font: 13px "IBM Plex Mono", ui-monospace, Menlo, monospace; }
#p-term .ghost[hidden] { display: none; }
#p-term .xterm-viewport { scrollbar-color: #3a3f43 transparent; }
#pane { --paper: var(--term-bg); --tint: #232729; --ink: #dcdfe1; --grey: #9ba2a7; --quiet: #6c7277; --rule: #2c3033;
        --blue: #3fb6ee; --orange: #ef9a4c; --red: #ec7468; --green: #5fbd8b; color-scheme: dark; color: var(--ink); font-size: 13px; }
#p-head { padding: 8px 12px 8px 14px; border-bottom: 1px solid var(--rule); }
.p-top { display: flex; align-items: center; gap: 12px; min-height: 24px; }
.p-title { font-size: 13px; font-weight: 500; flex: 1; line-height: 1.5; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-title:focus { white-space: normal; }
.p-top .act { font-size: 13px; color: var(--grey); } .p-top .act:hover { color: var(--ink); } .p-top .act.test { color: var(--blue); } .p-top .act.armed { color: var(--red); }
.p-err { color: var(--red); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.p-more { color: var(--grey); } .p-more:hover, .p-more.on { color: var(--ink); }
.p-x, .p-fold { color: var(--grey); align-self: center; } .p-x:hover, .p-fold:hover { color: var(--ink); }
.p-title[contenteditable]:hover, .p-title[contenteditable]:focus { outline: none; box-shadow: 0 1px 0 var(--quiet); }
.p-group { color: var(--grey); border-bottom: 1px dotted var(--quiet); width: 16ch; }
.p-group:hover, .p-group:focus { outline: none; color: var(--ink); border-bottom-color: var(--ink); }
.p-meta { font-size: 13px; color: var(--grey); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 0 18px; }
.p-meta span { white-space: nowrap; }
.p-acts { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; margin-top: 10px; font-size: 13px; }
.p-acts .act { color: var(--grey); display: inline-flex; align-items: baseline; gap: 4px; } .p-acts .act:hover { color: var(--ink); }
.p-acts .act.armed { color: var(--red); } .p-acts .act.test, .p-acts a.act { color: var(--blue); }
#p-body { flex: 1; overflow-y: auto; padding: 10px 14px 20px; font-size: 13px; line-height: 1.55; }
#p-body .it { margin: 4px 0; overflow-wrap: anywhere; }
#p-body .it.ask { position: relative; color: var(--ink); margin-top: 14px; padding: 2px 6px 2px calc(2ch + 6px); background: var(--tint); border-radius: 2px; }
#p-body .it.ask::before { content: '❯'; color: var(--grey); position: absolute; left: 6px; top: 2px; }
#p-body .it.ask.pending { color: var(--grey); }
#p-body .it.err { color: var(--red); }
#p-body .it.said { position: relative; color: var(--ink); padding-left: 2ch; margin-top: 8px; }
#p-body .it.said::before { content: '⏺'; position: absolute; left: 0; top: 0; }
#p-body .it p { margin: 0 0 .6em; } #p-body .it p:last-child { margin-bottom: 0; }
#p-body .it ul, #p-body .it ol { margin: 0 0 .6em; padding-left: 2.4ch; }
#p-body .it li { margin: .15em 0; }
#p-body .it b { font-weight: 500; }
#p-body .it code { background: var(--tint); border-radius: 3px; padding: 0 4px; font-size: 13px; }
#p-body .it pre { margin: 0 0 .6em; padding: 8px 10px; background: var(--tint); border-radius: 4px; white-space: pre; overflow-x: auto; font-size: 13px; }
#p-body .it .hd { font-weight: 500; }
#p-body .it.step { color: var(--grey); margin: 1px 0 1px 2ch; padding-left: 2ch; text-indent: -2ch; }
#p-body .it.step::before { content: '⎿ '; }
#p-body .empty { color: var(--grey); font-size: 13px; }
#p-foot { border-top: 1px solid var(--rule); padding: 8px 14px 10px; display: grid; grid-template-columns: 2ch 1fr; }
#p-foot::before { content: '❯'; color: var(--grey); line-height: 1.5; }
#p-foot:has(#p-reply[hidden])::before { content: none; }
#p-foot[hidden] { display: none; }
#p-tools { grid-column: 1 / -1; }
#p-reply { display: block; width: 100%; font-size: 13px; line-height: 1.5; resize: none; overflow-y: auto; caret-color: var(--blue); min-height: 1.5em; }
#p-reply:focus { outline: none; } #p-reply::placeholder { color: var(--grey); }
#p-reply[hidden] { display: none; }
#p-tools { display: flex; align-items: baseline; gap: 14px; margin-top: 8px; font-size: 13px; min-height: 1.4em; color: var(--grey); }
#p-tools:empty { display: none; }


@media (max-width: 720px) {
  main { width: calc(100% - 32px); padding-top: 28px; }
  :root { --pane: 100vw; }
  body.has-pane main { display: none; }
  body.has-pane.pane-min main { display: block; width: calc(100% - var(--rail) - 32px); margin-left: 16px; }
  .line { width: 36px; }
  .write textarea { font-size: 18px; }
  #p-head, #p-body, #p-foot { padding-left: 18px; padding-right: 18px; }
}
</style>
</head>

<main>
  <div class="top"><h1>Fleet</h1><a href="/board" title="The board: answer permission prompts for terminal sessions">Board</a><button id="refresh" title="Read again" aria-label="Read again"><svg class="i" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.2h-3.2"/></svg></button></div>
  <div class="err" id="err" hidden></div>
  <div id="accts"></div>
  <div class="machines" id="mlines"></div>
  <div class="write">
    <textarea id="prompt" rows="1" placeholder="What should it do?" aria-label="Prompt"></textarea>
    <div class="how">
      <select id="acct" aria-label="Account" title="Account"></select>
      <select id="mach" aria-label="Machine" title="Machine"></select>
      <input id="cwd" list="cwds" spellcheck="false" aria-label="Folder" title="Folder"><datalist id="cwds"></datalist>
      <select id="model" aria-label="Model" title="Model">
        <option value="">default</option><option value="opus">opus</option><option value="opus[1m]">opus 1m</option>
        <option value="sonnet">sonnet</option><option value="haiku">haiku</option><option value="fable">fable</option></select>
      <select id="effort" aria-label="Effort" title="Effort">
        <option value="">default effort</option><option value="low">low</option><option value="medium">medium</option>
        <option value="high">high</option><option value="xhigh">xhigh</option><option value="max">max</option></select>
      <span class="sp"></span><button class="fire" id="fire" title="⌘↵">Fire</button>
    </div>
    <div class="fired" id="said"></div>
  </div>
  <div id="machines"><div class="reading" aria-label="Reading the machines">…</div></div>
</main>
<aside id="pane" hidden aria-label="Session">
  <div id="p-grip" title="Drag to widen · double-click for the usual width"></div>
  <button id="p-rail" aria-label="Unfold"></button>
  <div id="p-head"></div>
  <div id="p-body"></div>
  <div id="p-term" hidden></div>
  <div id="p-foot"><textarea id="p-reply" rows="1" placeholder="Message it" aria-label="Message"></textarea><div id="p-tools"></div></div>
</aside>

<script>
const TOKEN = '__ACP_TOKEN__';
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem('fleet.' + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem('fleet.' + k, v); } catch {} } };
/** Elements are built with textContent only: session text comes from transcripts. */
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const ICONS = { more: ['M3.5 8h.01', 'M8 8h.01', 'M12.5 8h.01'], ext: ['M6.5 3.5h-3v9h9v-3', 'M9 3h4v4', 'M13 3 7.5 8.5'], x: ['M4 4l8 8', 'M12 4l-8 8'],
                fold: ['M4 4l4 4-4 4', 'M9 4l4 4-4 4'], unfold: ['M12 4 8 8l4 4', 'M7 4 3 8l4 4'] };
/** A drawn icon (stroke 1.5, currentColor). */
function icon(name) {
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16'); svg.setAttribute('class', 'i'); svg.setAttribute('aria-hidden', 'true');

  return svg;
}
async function api(p, body = {}) {

  if (r.status === 403) { location.reload(); throw new Error('reloading'); }
  return r.json();
}
const when = (t) => { const a = ago(t); return !a ? '' : a === 'now' ? 'now' : `${a} ago`; };
const ago = (t) => { if (!t) return ''; const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? 'now' : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
const until = (t) => { const s = (t - Date.now()) / 1000; return s <= 0 ? 'now' : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m` : `${Math.floor(s / 86400)}d ${Math.round((s % 86400) / 3600)}h`; };
const level = (p) => (p >= 90 ? 'hi' : p >= 70 ? 'mid' : '');
const shortModel = (m) => (typeof m !== 'string' ? null : m.replace(/^claude-/, '').replace(/-(\d+)-(\d+)/, ' $1.$2').replace(/-(\d+)$/, ' $1').replace('[1m]', ' 1m'));
const kTok = (n) => (n >= 1e6 ? `${Math.round(n / 1e5) / 10}M` : `${Math.round(n / 1000)}k`);

const lastPart = (p) => (typeof p === 'string' ? p.split('/').filter(Boolean).at(-1) ?? p : null);
const ORDER = { 'needs-you': 0, working: 1, capped: 2, ready: 3, closed: 4 };
const WORD = { 'needs-you': 'needs you', working: 'working', capped: 'at its limit', ready: 'ready', closed: 'closed' };

// ---------------------------------------------------------------- reading the snapshot
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

    ...(m.fleet?.dispatches ?? []).filter((d) => d.alive && !(m.workers ?? []).some((w) => w.pid === d.pid)).map((d) => ({ engine: 'fleet', state: 'working', live: true, title: d.key, sub: 'fleet', since: d.logAt, machine: m.name, pid: d.pid, doing: d.last })),
    ...(m.others ?? []).map((o) => ({ engine: o.engine, state: 'working', live: true, title: `${o.engine} ${o.kind}`, since: o.since, cwd: o.cwd, machine: m.name, pid: o.pid, doing: o.args,
      sub: subs.find((sub) => sub.places.some((pl) => pl.machine === m.name && pl.profile === o.profile))?.label ?? o.profile ?? '' })),
  ]);
  everything = [...all, ...extra];
  // One line per machine: how it is doing, and what runs on it.
  $('mlines').replaceChildren(...snap.machines.map((m) => {
    const bridges = (m.accounts ?? []).flatMap((a) => a.bridges ?? []);
    return h('div', { class: 'mline', title: bridges.length ? `Remote Control\n${bridges.map((b) => `${b.name}  ${b.sessions}`).join('\n')}` : '' },
      h('span', { class: 'nm', text: m.name }), m.ok === false ? h('span', { class: 'vitals hi', text: m.error ?? 'no answer' }) : vitals(m),
      tally(everything.filter((x) => x.machine === m.name)));
  }));
  // What needs you comes first, above every group: a question or a permission it waits on, then a limit it stopped at,
  // the longest wait first. The tab's title carries the count.
  const urgent = everything.filter((x) => x.live && (x.state === 'needs-you' || x.state === 'capped'))
    .sort((a, b) => (ORDER[a.state] - ORDER[b.state]) || ((a.lastAt ?? a.since ?? 0) - (b.lastAt ?? b.since ?? 0)));
  document.title = urgent.length ? `(${urgent.length}) Fleet` : 'Fleet';
  const top = urgent.length ? h('section', { class: 'epic urgent' }, h('header', {}, h('h2', { text: 'Needs you' }), tally(urgent)), urgent.map(row)) : null;
  // Then by group: the epics in the order fleet.json lists them, then the groups you made; open ones first, then closed,
  // newest first within each.
  const names = [...(snap.epics ?? []).map((e) => e.name), ...(snap.groups ?? []), 'Other'];
  $('fleet-groups').replaceChildren(...names.filter((n) => n !== 'Other').map((n) => h('option', { value: n })));
  const epicOf = (x) => (names.includes(x.epic) ? x.epic : 'Other');
  const blocks = names.map((name) => {
    const shown = everything.filter((x) => epicOf(x) === name && !urgent.includes(x)).sort((a, b) => (ORDER[a.state] - ORDER[b.state]) || ((b.lastAt ?? b.startedAt ?? b.since ?? 0) - (a.lastAt ?? a.startedAt ?? a.since ?? 0)));
    if (!shown.length) return null;
    const test = (snap.epics ?? []).find((e) => e.name === name)?.test;
    const closed = shown.filter((x) => !x.live);
    const arm = armedEpic === name;
    const sweep = closed.length ? h('button', { class: arm ? 'armed' : '', text: arm ? `archive ${closed.length}?` : 'archive',
      onclick: async () => {
        if (!arm) { armedEpic = name; renderMachines(); clearTimeout(epicT); epicT = setTimeout(() => { if (armedEpic === name) { armedEpic = null; renderMachines(); } }, 4000); return; }
        armedEpic = null;
        const r = await api('/api/fleet/archive-all', { sessions: closed.filter((x) => x.sessionId || x.id).map((x) => ({ machine: x.machine, engine: x.engine, profile: x.profile, sessionId: x.sessionId, id: x.id })) }).catch((e) => ({ ok: false, kept: [String(e.message)] }));
        await load();
        if (r.kept?.length) { $('err').hidden = false; $('err').textContent = `${r.kept.length} not archived: ${r.kept[0]}`; }
      } }) : null;
    return h('section', { class: 'epic' },
      h('header', {}, h('h2', { text: name }), test ? h('a', { class: 'test', href: test, title: `Open ${test}`, onclick: (e) => { e.preventDefault(); openTest(test); } }, 'TEST', icon('ext')) : null, tally(shown)),
      shown.filter((x) => x.live).map(row),
      closed.length ? h('div', { class: 'shut' },
        h('div', { class: 'bar' }, h('button', { class: 'fold-closed', 'aria-expanded': String(openShut.has(name)), text: `${openShut.has(name) ? '▾' : '▸'} ${closed.length} closed`,
          onclick: () => { if (openShut.has(name)) openShut.delete(name); else openShut.add(name); store.set('open-closed', JSON.stringify([...openShut])); renderMachines(); } }), sweep),
        openShut.has(name) ? closed.map(gone) : null) : null);
  }).filter(Boolean);
  $('machines').replaceChildren(...[top, ...blocks].filter(Boolean));
}

// ---------------------------------------------------------------- load
// A load asked for while one runs (after a close, an archive, a move or Fire) runs right after it, never dropped.
let loading = false, again = false, loadedAt = 0;
async function load() {
  if (loading) { again = true; return; }
  loading = true; loadedAt = Date.now(); $('refresh').classList.add('busy');
  try {
    snap = await api('/api/fleet');
    subs = accounts(snap);
    const bad = snap.machines.filter((m) => m.ok === false || m.stale);
    $('err').hidden = !bad.length;
    $('err').textContent = bad.map((m) => (m.stale ? `${m.name} didn't answer (${m.stale}): showing its last read` : `${m.name}: ${m.error ?? 'no answer'}`)).join('\n');
    renderHow(); renderMachines(); renderPane();
    $('refresh').title = `Read ${new Date(snap.at).toLocaleTimeString()}`;
  } catch (e) { if (e.message !== 'reloading') { $('err').hidden = false; $('err').textContent = String(e.message); } }
  loading = false; $('refresh').classList.remove('busy');
  if (again) { again = false; load(); }
}
$('refresh').addEventListener('click', load);
load();
// Every 20 seconds while you look; every minute in a background tab, so the Needs you count in its title stays true.
setInterval(() => { if (!document.hidden || Date.now() - loadedAt > 60_000) load(); }, 20_000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
