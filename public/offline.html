<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet</title>
<style>
:root { --paper: #f6f7f7; --ink: #1e2124; --grey: #5f666b; }
@media (prefers-color-scheme: dark) { :root { --paper: #191b1d; --ink: #dcdfe1; --grey: #9ba2a7; } }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.7 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; -webkit-font-smoothing: antialiased; }
main { max-width: 620px; margin: 0 auto; padding: calc(44px + env(safe-area-inset-top)) 24px 44px; }
p { margin: 0 0 14px; }
.q { color: var(--grey); font-size: 13px; }
</style>
</head>
<body>
<main>
<p>Your Mac is unreachable. Fleet opens again when the tailnet is back.</p>
<p class="q">Check that Tailscale is on, on this phone and on the Mac.</p>
</main>
</body>
</html>
