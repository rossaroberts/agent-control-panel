<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Context</title>
<link rel="preload" href="/vendor/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* IBM Plex Mono (SIL OFL, vendor/LICENSE-plex-mono), served from here: nothing waits on another site. */

  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* After iA Writer: paper, ink, one typeface, one blue. Structure is whitespace and tone, never boxes; words only where a
   glyph can't say it. Every text colour clears 4.5:1 on paper and on the selection tint; --quiet is for drawn marks only. */
:root {
  --paper: #f6f7f7; --tint: #eceeef; --ink: #1e2124; --grey: #5f666b; --quiet: #858c91; --rule: #e2e5e7;
  --blue: #0a72a3; --orange: #a5560f; --red: #bf3f33; --green: #2b7d52;
  --font: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #191b1d; --tint: #232729; --ink: #dcdfe1; --grey: #9ba2a7; --quiet: #6c7277; --rule: #2c3033;
          --blue: #3fb6ee; --orange: #ef9a4c; --red: #ec7468; --green: #5fbd8b; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.7 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in srgb, var(--blue) 24%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
main { width: min(1500px, 100% - 64px); margin: 0 auto; padding: 44px 0 120px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }
svg.i { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }

/* top line: the screens of the panel; the one you are on is in ink */
.top { display: flex; align-items: center; gap: 26px; margin-bottom: 36px; }
.top .tabs { display: flex; gap: 26px; flex: 1; }
.top .tabs a { color: var(--grey); letter-spacing: .01em; }
.top .tabs a:hover { color: var(--ink); }
.top .tabs a[aria-current] { color: var(--ink); font-weight: 500; }
.top .read { font-size: 13px; color: var(--grey); white-space: nowrap; }
.top button { color: var(--grey); display: inline-flex; align-items: center; }
.top button:hover { color: var(--ink); }
.top button.busy svg { animation: turn 900ms linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .top button.busy svg { animation: none; opacity: .5; } }
.err { color: var(--red); font-size: 13px; margin: -16px 0 22px; white-space: pre-line; }

/* the documents on the left, the one chosen beside them */
.ctx { display: grid; grid-template-columns: minmax(190px, 270px) minmax(0, 1fr); gap: 0 clamp(32px, 5vw, 72px); align-items: start; }
.list { position: sticky; top: 28px; margin: 0; padding: 0; list-style: none; }
.list a { display: block; padding: 4px 10px; margin: 0 -10px 2px; border-radius: 4px; }
.list a:hover { background: color-mix(in srgb, var(--tint) 60%, transparent); }
.list a[aria-current] { background: var(--tint); }
.list .n { display: block; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list a:hover .n { color: var(--ink); }
.list a[aria-current] .n { color: var(--ink); font-weight: 500; }
.list .d { display: block; font-size: 13px; line-height: 1.5; color: var(--grey); }
.list .none { font-size: 13px; color: var(--grey); }

/* the document: what it is, where it comes from, then the document itself */
.doc { min-width: 0; }
.doc h1.t { font-size: 17px; font-weight: 500; line-height: 1.5; margin: 0; }
.doc .back { font-size: 13px; color: var(--blue); display: inline-block; margin-bottom: 8px; }
.doc .back:hover { text-decoration: underline; text-underline-offset: 3px; }
.doc .about, .doc .meta, .doc .sync { font-size: 13px; line-height: 1.6; color: var(--grey); overflow-wrap: anywhere; }
.doc .about { color: var(--ink); margin-top: 2px; }
.doc .meta { margin-top: 2px; }
.doc .meta .p { user-select: all; }
.doc .sync { margin-top: 10px; }
.doc .sync .ok { color: var(--green); } .doc .sync .bad { color: var(--red); } .doc .sync .stale { color: var(--orange); }
.doc .gap { height: 30px; }
.reading { color: var(--grey); font-size: 13px; }

/* markdown, as the rest of the panel writes: one typeface, tone for rank, no boxes but the tint behind code */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-weight: 500; line-height: 1.5; margin: 34px 0 10px; }
.md h1 { font-size: 17px; margin-top: 38px; }
.md h2 { font-size: 15px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.md h3, .md h4, .md h5, .md h6 { font-size: 15px; color: var(--grey); margin-top: 26px; margin-bottom: 6px; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 14px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 2px 0; }
.md li > p { margin: 0 0 6px; }
.md a { color: var(--blue); }
.md a:hover { text-decoration: underline; text-underline-offset: 3px; }
.md code { font-size: 13px; background: var(--tint); border-radius: 3px; padding: 1px 5px; }
.md pre { background: var(--tint); border-radius: 4px; padding: 12px 16px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.md pre code { background: none; padding: 0; font-size: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
.md pre.raw code { color: var(--grey); }
.md blockquote { margin-left: 0; padding-left: 16px; border-left: 2px solid var(--rule); color: var(--grey); }
.md hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0; }
.md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; font-size: 13px; }
.md th { text-align: left; font-weight: 500; padding: 4px 18px 4px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.md td { padding: 3px 18px 3px 0; vertical-align: top; }
.md td code { white-space: nowrap; }
.md input[type=checkbox] { margin: 0 6px 0 0; }
.md .noimg { color: var(--grey); }
.md strong { font-weight: 500; }

@media (max-width: 760px) {
  main { width: calc(100% - 32px); padding-top: 28px; }
  .top, .top .tabs { flex-wrap: wrap; gap: 4px 20px; }
  .top .read { display: none; }
  .ctx { grid-template-columns: minmax(0, 1fr); }
  .list { position: static; display: flex; flex-wrap: wrap; gap: 2px 6px; margin-bottom: 30px; }
  .list li { min-width: 0; }
  .list a { margin: 0; padding: 2px 10px; }
  .list .d { display: none; }
}
</style>
<script src="/vendor/marked.umd.js"></script>
</head>
<body>
<main>
  <nav class="top" aria-label="Panel">
    <div class="tabs"><a href="/">Fleet</a><a href="/satellite">Satellite</a><a href="/context" aria-current="page">Context</a><a href="/world">World</a></div>
    <span class="read" id="read"></span>
    <button id="refresh" title="Read again" aria-label="Read again"><svg class="i" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.2h-3.2"/></svg></button>
  </nav>
  <div class="err" id="err" hidden></div>
  <div class="ctx">
    <ul class="list" id="list" aria-label="Documents"></ul>
    <article class="doc" id="doc" aria-live="polite"><div class="reading">Reading…</div></article>
  </div>
</main>
<script type="module" nonce="__ACP_NONCE__">
import { renderSafe } from '/context-render.mjs';
const TOKEN = '__ACP_TOKEN__';
const $ = (id) => document.getElementById(id);
/** Elements are built with textContent only: a path, a machine name or a note's title is somebody's text. The one exception is the
 *  markdown body below, which is public/context-render.mjs's output (raw HTML in a document is text there, links are checked). */
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
async function api(body = {}) {
  let r;
  try {
    r = await fetch('/api/context', { method: 'POST', headers: { 'content-type': 'application/json', 'x-acp-token': TOKEN }, body: JSON.stringify(body), signal: AbortSignal.timeout(40_000) });
  } catch (e) { throw new Error(e?.name === 'TimeoutError' ? 'The panel did not answer in time.' : 'The panel is not reachable: is it running?'); }
  if (r.status === 403) { reloadFresh(); throw new Error('reloading'); }
  return r.json();
}
/** The panel restarted (a new token): load the page again, once. */
function reloadFresh() {
  try {
    if (Date.now() - (Number(sessionStorage.getItem('context.reloadAt')) || 0) < 10_000) return;
    sessionStorage.setItem('context.reloadAt', String(Date.now()));
  } catch {}
  location.reload();
}
const ago = (t) => { if (!t) return ''; const s = Math.max(0, (Date.now() - t) / 1000); return s < 60 ? 'now' : s < 3600 ? `${Math.round(s / 60)}m` : s < 86400 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
const when = (t) => { const a = ago(t); return !a ? '' : a === 'now' ? 'now' : `${a} ago`; };

// ---------------------------------------------------------------- state: the list, and what the address says is open
// #<id> is a document; #memory/<name>.md is one of the memory folder's notes, inside it.
let data = null, loadedAt = 0, loading = false;
const notes = new Map(); // name → the answer for that note, until the next read
const route = () => { const [id, ...rest] = decodeURIComponent(location.hash.slice(1)).split('/'); return { id: id || null, note: rest.join('/') || null }; };

function renderList(sel) {
  $('list').replaceChildren(...data.documents.map((d) => h('li', {}, h('a', { href: `#${d.id}`, 'aria-current': d.id === sel ? 'page' : null, title: d.about },
    h('span', { class: 'n', text: d.title }), h('span', { class: 'd', text: d.about })))));
}

/** The line about the memory sync, from ~/.memory-sync/status.json (the server has checked and cut every field). */
function syncLine(s) {
  if (!s) return null;
  if (s.unreadable) return h('div', { class: 'sync' }, 'memory sync · ', h('span', { class: 'bad', text: 'status file unreadable' }));
  const stale = s.at && s.every && Date.now() - s.at > 3 * s.every + 60_000;
  const word = s.ok === false ? h('span', { class: 'bad', text: 'failed' }) : stale ? h('span', { class: 'stale', text: 'stale' }) : s.ok ? h('span', { class: 'ok', text: 'ok' }) : 'unknown';
  const parts = [word, s.at ? h('span', { title: new Date(s.at).toLocaleString(), text: when(s.at) }) : null,
    s.machines?.length ? s.machines.map((m) => (m.state && m.state !== 'ok' ? `${m.name} ${m.state}` : m.name)).join(', ') : null,
    s.trouble?.length ? h('span', { class: 'bad', text: `check ${s.trouble.join(', ')}` }) : null, s.note];
  return h('div', { class: 'sync' }, 'memory sync', ...parts.filter(Boolean).flatMap((p) => [' · ', p]));
}

/** The document pane: its name and where it comes from, then the markdown. */
function paint({ title, about, path, at, markdown, notes: own, status, back, missing }) {
  const body = h('div', { class: 'md' });
  body.innerHTML = renderSafe(window.marked, markdown ?? '', { notes: own ?? '' }); // safe by construction: see context-render.mjs
  const pane = $('doc');
  pane.replaceChildren(...[
    back ? h('a', { class: 'back', href: back.href, text: `← ${back.text}` }) : null,
    h('h1', { class: 't', text: title }),
    about ? h('div', { class: 'about', text: about }) : null,
    h('div', { class: 'meta' }, path ? h('span', { class: 'p', text: path }) : null, at ? [path ? ' · ' : '', 'modified ', h('span', { title: new Date(at).toLocaleString(), text: when(at) })] : null, missing ? ' · not found' : null),
    syncLine(status),
    h('div', { class: 'gap' }), body].filter(Boolean));
}

let shown = null; // which document (and note) the pane shows: a new one starts at the top, a read again keeps your place
async function render() {
  if (!data) return;
  const r = route(), docs = data.documents;
  const doc = docs.find((d) => d.id === r.id) ?? docs[0];
  if (!doc) { $('list').replaceChildren(h('li', { class: 'none', text: 'No documents.' })); $('doc').replaceChildren(); return; }
  renderList(doc.id);
  document.title = `${doc.title} · Context`;
  const at = `${doc.id}/${doc.notes ? r.note ?? '' : ''}`, moved = at !== shown;
  shown = at;
  if (r.note && doc.notes) {
    const want = r.note;
    let n = notes.get(want);
    if (!n) {
      $('doc').replaceChildren(h('div', { class: 'reading', text: 'Reading…' }));
      try { n = await api({ note: want }); } catch (e) { if (e?.message === 'reloading') return; n = { ok: false, error: e.message }; }
      if (n?.ok) notes.set(want, n);
      if (route().note !== want || route().id !== doc.id) return; // moved on while it was read
    }
    const back = { href: `#${doc.id}`, text: doc.title };
    if (n?.ok) paint({ ...n.note, notes: doc.id, back });
    else paint({ title: want, markdown: '', about: n?.error || 'It could not be read.', back });
    if (moved) window.scrollTo(0, 0);
    return;
  }
  paint({ ...doc, notes: doc.notes ? doc.id : '' });
  if (moved) window.scrollTo(0, 0);
}

async function load(fresh = false) {
  if (loading) return;
  loading = true;
  $('refresh').classList.add('busy');
  try {
    const r = await api({});
    if (r?.ok) {
      data = r; loadedAt = Date.now(); notes.clear();
      $('err').hidden = true;
      await render();
      showRead();
    } else {
      $('err').hidden = false; $('err').textContent = r?.error || 'The panel could not read the documents.';
    }
  } catch (e) {
    if (e?.message === 'reloading') return;
    $('err').hidden = false; $('err').textContent = e.message;
  } finally { loading = false; $('refresh').classList.remove('busy'); }
}
function showRead() {
  if (!data) return;
  $('read').textContent = `read ${when(data.at) || 'now'}`;
  $('read').title = new Date(data.at).toLocaleTimeString();
}
$('refresh').addEventListener('click', () => load(true));
window.addEventListener('hashchange', () => render());
setInterval(() => { if (!document.hidden) { showRead(); } }, 20_000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - loadedAt > 60_000) load(); });

// Keys, as Fleet's: g then f / s / c / w goes to that screen; j and k step through the documents.
let gPressed = 0;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.isComposing) return;
  if (document.activeElement?.matches?.('input, textarea, select, [contenteditable]')) return;
  const k = e.key;
  if (Date.now() - gPressed < 1200) {
    gPressed = 0;
    const to = { f: '/', s: '/satellite', c: '/context', w: '/world' }[k];
    if (to) { e.preventDefault(); if (to !== location.pathname) location.href = to; }
    return;
  }
  if (k === 'g') { gPressed = Date.now(); return; }
  if (k === 'Escape' && route().note) { location.hash = `#${route().id}`; return; }
  if ((k === 'j' || k === 'k') && data) {
    const ids = data.documents.map((d) => d.id), at = Math.max(0, ids.indexOf(route().id ?? ids[0]));
    const next = ids[Math.min(ids.length - 1, Math.max(0, at + (k === 'j' ? 1 : -1)))];
    if (next) { e.preventDefault(); location.hash = `#${next}`; }
  }
});
load();
</script>
</body>
</html>
